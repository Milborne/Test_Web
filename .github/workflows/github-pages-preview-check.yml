name: Game2Web GitHub Pages Preview Check

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "HTTPS URL returned by the GitHub Pages deployment"
        required: true
        type: string
  workflow_run:
    workflows: ["Game2Web GitHub Pages Preview"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  browser:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.11.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium firefox msedge
      - name: Download URL from completed deployment run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-pages-preview-url
          path: .validation
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Download Platformer input audit from completed deployment run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-pages-preview-input-audit
          path: .validation/input-audit
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Audit pinned Platformer input map for manual browser checks
        if: github.event_name == 'workflow_dispatch'
        env:
          COMPATIBILITY_PROJECTS: godot-platformer
          COMPATIBILITY_WORKSPACE: .validation/source
        run: |
          bash scripts/compatibility/fetch-external-projects.sh tests/compatibility/external-projects.yml "$COMPATIBILITY_WORKSPACE"
          project_dir="$(awk -F '\t' '$1 == "godot-platformer" { print $6 }' "$COMPATIBILITY_WORKSPACE/projects.tsv")"
          test -n "$project_dir"
          mkdir -p .validation/input-audit
          node scripts/compatibility/audit-godot-input.mjs "$project_dir" > .validation/input-audit/input-audit.json
      - name: Set Platformer input audit path
        run: echo "GODOT_INPUT_AUDIT_PATH=.validation/input-audit/input-audit.json" >> "$GITHUB_ENV"
      - name: Save manually supplied preview URL
        if: github.event_name == 'workflow_dispatch'
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          mkdir -p .validation
          printf 'PERSISTENT_PREVIEW_URL=%s\n' "$PREVIEW_URL" > .validation/preview-url.txt
      - name: Validate preview URL
        run: |
          test -s .validation/preview-url.txt
          preview_url="$(sed -n 's/^PERSISTENT_PREVIEW_URL=//p' .validation/preview-url.txt | head -1)"
          PREVIEW_URL="$preview_url" node -e 'const u=new URL(process.env.PREVIEW_URL); if (u.protocol !== "https:" || u.hostname !== "milborne.github.io" || !/^\/Test_Web\/previews\/platformer-[0-9]+\/$/.test(u.pathname)) throw new Error("Expected the real HTTPS GitHub Pages Platformer preview URL for this repository");'
          echo "GITHUB_PAGES_PREVIEW_URL=$preview_url" >> "$GITHUB_ENV"
      - name: Test deployed Godot runtime in Chromium
        run: npx playwright test e2e/github-pages-preview.spec.ts --reporter=line --browser chromium
      - name: Test deployed Godot runtime in Firefox
        if: always()
        run: npx playwright test e2e/github-pages-preview.spec.ts --reporter=line --browser firefox
      - name: Test deployed Godot runtime in Microsoft Edge
        if: always()
        env:
          PLAYWRIGHT_CHANNEL: msedge
        run: npx playwright test e2e/github-pages-preview.spec.ts --reporter=line --browser chromium
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages-preview-browser-report
          path: |
            .validation/playwright-report
            test-results
          if-no-files-found: warn
          include-hidden-files: true
